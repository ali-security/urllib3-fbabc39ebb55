name: lint

# workflow_dispatch only: not part of the sealed build (lint gate); push would
# fire it on every fork sync onto the retired ubuntu-20.04 label.
on: workflow_dispatch

jobs:
  lint:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: "3.8"
      - name: Lint the code
        uses: pre-commit/action@v2.0.0

